name: Offline submission checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: starter_v0/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: starter_v0
      - run: python scripts/final_check.py
        working-directory: starter_v0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-evidence
          path: starter_v0/analysis/
